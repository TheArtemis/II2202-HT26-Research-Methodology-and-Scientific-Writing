name: full
description: Main experimental matrix (900 runs with heartbeat fixed at 10ms).
output_dir: results/full
binaries:
    raftd: /opt/ii2202/experiments/bin/raftd
    raftclient: /opt/ii2202/experiments/bin/raftclient
mininetd:
    addr: ""
matrix:
    topologies:
        - t0
        - t1
        - t2
        - t3
        - t4
    modes:
        - direct
        - forwarding
    delays:
        - 0.5ms
        - 5ms
        - 20ms
    heartbeats:
        - 10ms
    repetitions: 30
timing:
    cluster_ready_timeout: 30s
    settle: 1s
    warmup: 10s
    observe: 30s
    teardown_pause: 1s
workload:
    rate: 100
    payload_size: 64
    apply_timeout: 2s
    client_node: ""
raft:
    raft_port: 7000
    api_port: 7001
    seed_t3: true
qa:
    validate_after_inject: true
    require_warmup_commits: true
    min_warmup_ok: 1
    continue_on_error: true
    host_load_max_1m: 16
    host_load_interval: 1s
seeds:
    base: 20260926
