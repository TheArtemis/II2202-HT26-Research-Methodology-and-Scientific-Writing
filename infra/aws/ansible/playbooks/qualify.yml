---
# Smoke qualify: ensure mininetd is up and harness can run smoke trials.
- name: Qualify workers with smoke config
  hosts: workers
  become: true
  gather_facts: false
  vars:
    experiments_dir: /opt/ii2202/experiments
    smoke_config: configs/smoke.yaml
  tasks:
    - name: Ensure mininetd is running
      ansible.builtin.systemd:
        name: mininetd
        state: started
        enabled: true

    - name: Wait for mininetd socket
      ansible.builtin.wait_for:
        path: /tmp/mininetd.sock
        state: present
        timeout: 60

    - name: Dry-run smoke config
      ansible.builtin.command:
        cmd: ./bin/harness dry-run {{ smoke_config }}
        chdir: "{{ experiments_dir }}"
      become_user: root
      changed_when: false

    - name: Run smoke trials
      ansible.builtin.command:
        cmd: ./bin/harness run {{ smoke_config }}
        chdir: "{{ experiments_dir }}"
      become_user: root
      register: smoke_run
      changed_when: true

    - name: Show smoke output
      ansible.builtin.debug:
        msg: "{{ smoke_run.stderr_lines | default([]) + smoke_run.stdout_lines | default([]) }}"
