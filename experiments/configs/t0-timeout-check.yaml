name: t0-timeout-check
description: Short T0 baseline check at each link delay with a 500ms heartbeat timeout.
output_dir: results/t0-timeout-check-20261014

binaries:
  raftd: ./bin/raftd
  raftclient: ./bin/raftclient

matrix:
  topologies: [t0]
  modes: [direct, forwarding]
  delays: [0.5ms, 5ms, 20ms]
  heartbeats: [500ms]
  repetitions: 1

timing:
  cluster_ready_timeout: 20s
  settle: 1s
  warmup: 5s
  observe: 10s
  teardown_pause: 500ms

workload:
  rate: 100
  payload_size: 64
  apply_timeout: 2s

raft:
  pre_vote_disabled: true
  raft_port: 7000
  api_port: 7001
  seed_t3: false

qa:
  validate_after_inject: true
  require_warmup_commits: true
  min_warmup_ok: 400
  continue_on_error: true
  host_load_max_1m: 16.0
  host_load_interval: 1s

seeds:
  base: 20261014
