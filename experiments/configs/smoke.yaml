# Smoke — single T4 condition, 1 repetition (sanity before pilot).
name: smoke
description: Quick end-to-end check of Mininet + Raft + open-loop client on T4.
output_dir: results/smoke

binaries:
  raftd: ./bin/raftd
  raftclient: ./bin/raftclient

mininetd:
  addr: ""

matrix:
  topologies: [t4]
  modes: [direct, forwarding]
  delays: [5ms]
  heartbeats: [10ms]
  repetitions: 1

timing:
  cluster_ready_timeout: 20s
  settle: 1s
  warmup: 3s
  observe: 10s
  teardown_pause: 500ms

workload:
  rate: 50
  payload_size: 64
  apply_timeout: 2s
  client_node: ""   # initial_leader (B for T4)

raft:
  raft_port: 7000
  api_port: 7001
  seed_t3: true

qa:
  validate_after_inject: true
  require_warmup_commits: true
  min_warmup_ok: 3
  continue_on_error: false

seeds:
  base: 1000
