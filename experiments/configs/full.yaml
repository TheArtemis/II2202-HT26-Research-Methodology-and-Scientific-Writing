# Full — Stage 4 main data collection (20 repetitions).
# Freeze workload/timing after pilot before using this file.
name: full
description: Main experimental matrix (600 runs with heartbeat fixed at 10ms).
output_dir: results/full

binaries:
  raftd: ./bin/raftd
  raftclient: ./bin/raftclient

mininetd:
  addr: ""

matrix:
  topologies: [t0, t1, t2, t3, t4]
  modes: [direct, forwarding]
  delays: [0.5ms, 5ms, 20ms]
  heartbeats: [10ms]
  repetitions: 20

timing:
  cluster_ready_timeout: 30s
  settle: 1s
  warmup: 3s
  observe: 20s
  teardown_pause: 1s

workload:
  rate: 100
  payload_size: 64
  apply_timeout: 2s
  client_node: ""

raft:
  raft_port: 7000
  api_port: 7001
  seed_t3: true

qa:
  validate_after_inject: true
  require_warmup_commits: true
  min_warmup_ok: 5
  continue_on_error: true

seeds:
  base: 20260926
