# Full — Stage 4 main data collection (30 repetitions → 900 trials).
# Matrix: 5 topologies × 2 modes × 3 delays × 30 reps = 900 runs.
# Freeze workload/timing after pilot before using this file.
# AWS fleet: shard equally across 16 workers (ceil(900/16)=57 trials each); see infra/aws/README.md.
name: full
description: Main experimental matrix (900 runs with heartbeat fixed at 10ms).
output_dir: results/full

binaries:
  raftd: ./bin/raftd
  raftclient: ./bin/raftclient

mininetd:
  addr: ""

matrix:
  topologies: [t0, t1, t2, t3, t4]
  modes: [direct, forwarding]
  delays: [0.5ms, 5ms, 20ms]
  heartbeats: [10ms]
  repetitions: 30

timing:
  cluster_ready_timeout: 60s
  settle: 1s
  warmup: 30s
  observe: 30s
  teardown_pause: 1s

workload:
  rate: 100
  payload_size: 64
  apply_timeout: 2s
  client_node: ""

raft:
  raft_port: 7000
  api_port: 7001
  seed_t3: true

qa:
  validate_after_inject: true
  require_warmup_commits: true
  min_warmup_ok: 1
  continue_on_error: true
  host_load_max_1m: 16.0
  host_load_interval: 1s

seeds:
  base: 20260926
