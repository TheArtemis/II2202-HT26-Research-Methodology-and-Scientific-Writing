# Pilot — Stage 3: five repetitions of every main-matrix condition.
#
# Research-plan main matrix = topologies × modes × delays × reps
# (heartbeat fixed at 10ms so 5×2×3×5 = 150 pilot runs; full uses 20 reps → 600).
# Add heartbeats [1ms, 10ms, 500ms] later if crossing that IV (HashiCorp floor 5ms).
name: pilot
description: Five pilot runs per condition for variability and runtime estimates.
output_dir: results/pilot

binaries:
  raftd: ./bin/raftd
  raftclient: ./bin/raftclient

mininetd:
  addr: ""

matrix:
  topologies: [t2, t3, t4]
  modes: [direct, forwarding]
  delays: [1ms]
  heartbeats: [20ms]
  repetitions: 5

timing:
  cluster_ready_timeout: 10s
  settle: 1s
  warmup: 0s
  observe: 10s
  teardown_pause: 1s

workload:
  rate: 5000
  payload_size: 64
  apply_timeout: 2s
  client_node: ""

raft:
  raft_port: 7000
  api_port: 7001
  seed_t3: true

qa:
  validate_after_inject: true
  require_warmup_commits: false
  min_warmup_ok: 5
  continue_on_error: true
  host_load_max_1m: 16.0
  host_load_interval: 1s

seeds:
  base: 20260926
