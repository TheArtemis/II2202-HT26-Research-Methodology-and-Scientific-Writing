# Pilot — Stage 3: five repetitions of every main-matrix condition.
#
# Research-plan main matrix = topologies × modes × delays × reps
# (heartbeat timeout fixed at 500ms so 5×2×3×5 = 150 pilot runs; full uses 30 reps → 900).
# Use heartbeat-sweep.yaml to vary the timeout after validating the pilot.
name: pilot
description: Five pilot runs per condition for variability and runtime estimates.
output_dir: results/pilot

binaries:
  raftd: ./bin/raftd
  raftclient: ./bin/raftclient

mininetd:
  addr: ""

matrix:
  topologies: [t0, t1, t2, t3, t4]
  modes: [direct, forwarding]
  delays: [0.5ms, 5ms, 20ms]
  heartbeats: [500ms]
  repetitions: 5

timing:
  cluster_ready_timeout: 30s
  settle: 1s
  warmup: 3s
  observe: 20s
  teardown_pause: 1s

workload:
  rate: 100
  payload_size: 64
  apply_timeout: 2s
  client_node: ""

raft:
  pre_vote_disabled: true
  raft_port: 7000
  api_port: 7001
  seed_t3: true

qa:
  validate_after_inject: true
  require_warmup_commits: true
  min_warmup_ok: 5
  continue_on_error: true
  host_load_max_1m: 16.0
  host_load_interval: 1s

seeds:
  base: 20260926
